<style>
  table {
    border-collapse: collapse;
    width: 100%;
    font-family: Arial, sans-serif;
    font-size: 14px;
  }

  th,
  td {
    border: 1px solid #ddd;
    padding: 8px;
    text-align: left;
  }

  th {
    background: #f4f4f4;
    position: sticky;
    top: 0;
  }

  tr:nth-child(even) {
    background: #fafafa;
  }

  .sev-high {
    color: #d32f2f;
    font-weight: bold;
  }

  .sev-medium {
    color: #f57c00;
    font-weight: bold;
  }

  .sev-low {
    color: #388e3c;
    font-weight: bold;
  }

  .summary {
    max-width: 500px;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    row-gap: 0.5rem;
    column-gap: 2rem;
    margin-bottom: 15px;
    align-items: center;

  }

  label {
    display: flex;
    flex-direction: column;
    font-size: 14px;
  }

  input,
  select {
    padding: 0.25rem 0.5rem;
    width: 8rem;
  }

  button {
    padding: 0.25rem 0.5rem;
  }
</style>
<div id="filters" class="filters">
  <label>
    PAT:
    <input type="text" id="pat">
  </label>
  <label>
    Repository:
    <select id="repo">
      <option value="All" selected>All Repositories</option>
      <option value="CPSServicesGateway">CPSServicesGateway</option>
      <option value="CPSIdentity">CPSIdentity</option>
      <option value="DigitalWalletServices">DigitalWalletServices</option>
      <option value="CPSCardTokenizationService">CPSCardTokenizationService</option>
      <option value="CpsPortal">CpsPortal</option>
      <option value="CPSOpenApiSpecs">CPSOpenApiSpecs</option>
      <!-- <option value="CPSCarl2.0">CPSCarl2.0</option> -->
      <option value="CPSCardContact">CPSCardContact</option>
      <option value="CPSCardManagement">CPSCardManagement</option>
      <!-- <option value="Jha.Cps.Logging">Jha.Cps.Logging</option> -->
      <!-- <option value="SyncAzureToGitHub">SyncAzureToGitHub</option> -->
      <!-- <option value="node-openid-provider">node-openid-provider</option> -->
      <option value="CPSRightTimePaymentService">CPSRightTimePaymentService</option>
      <!-- <option value="CardTokenization-POC">CardTokenization-POC</option> -->
      <!-- <option value="JBridgePscuService">JBridgePscuService</option> -->
      <!-- <option value="CPSPscuDataExchange">CPSPscuDataExchange</option> -->
      <!-- <option value="CPSServiceCore">CPSServiceCore</option> -->
    </select>
  </label>

  <label>
    Fixed After:
    <input type="date" id="fromDate">
  </label>
  <label>
    Fixed Before:
    <input type="date" id="toDate">
  </label>
  <label>
    Created After:
    <input type="date" id="createFrom">
  </label>
  <label>
    Created Before:
    <input type="date" id="createTo">
  </label>
  <label>
    Status:
    <select id="status">
      <option value="">All Status</option>
      <option value="open">Open</option>
      <option value="fixed">Fixed</option>
      <option value="dismissed">Dismissed</option>
    </select>
  </label>
  <label>
    Severity:
    <select id="severity">
      <option value="">All Severity</option>
      <option value="critical">Critical</option>
      <option value="high">High</option>
      <option value="medium">Medium</option>
      <option value="low">Low</option>
    </select>
  </label>
  <label>
    Scan Type:
    <select id="scanType">
      <option value="all">All</option>
      <option value="dependabot">Dependabot</option>
      <option value="codescanning">Code Scanning</option>
    </select>
  </label>
  <button onclick="search()">Search</button>
  <button onclick="exportExcel()">Export</button>
  <button onclick="exportSummary()">Export Summary</button>
</div>
<div id="app">
</div>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script>
  document.getElementById("pat").value = localStorage.getItem("github_pat");
  let token = "";
  let rows = [];
  const allRepos = [
    "CPSServicesGateway",
    "CPSIdentity",
    "DigitalWalletServices",
    "CPSCardTokenizationService",
    "CpsPortal",
    "CPSOpenApiSpecs",
    // "CPSCarl2.0",
    "CPSCardContact",
    "CPSCardManagement",
    // "Jha.Cps.Logging",
    // "SyncAzureToGitHub",
    // "node-openid-provider",
    "CPSRightTimePaymentService",
    // "CardTokenization-POC",
    // "JBridgePscuService",
    // "CPSPscuDataExchange",
    // "CPSServiceCore"
  ];
  function setToken() {
    token = document.getElementById("pat")?.value?.trim();
    if (token)
      localStorage.setItem("github_pat", token);
    else {
      alert("Please enter a GitHub Personal Access Token (PAT) to proceed.");
      throw new Error("GitHub Personal Access Token (PAT) is required.");
    }
  }
  async function loadRepoAlerts(repo, scanType) {
    let results = [];

    const endpointMap = {
      dependabot: "dependabot/alerts",
      codescanning: "code-scanning/alerts"
    };

    const endpoint = endpointMap[scanType];

    let url = `https://api.github.com/repos/JHACPS/${repo}/${endpoint}?per_page=100`;

    while (url) {
      const response = await fetch(url, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });

      const alerts = await response.json();

      alerts.forEach(a => {
        a.repoName = repo;
        a.scanType = scanType;
      });

      results.push(...alerts);

      const link = response.headers.get("Link");
      const match = link?.match(/<([^>]+)>;\s*rel="next"/);
      url = match ? match[1] : null;
    }

    return results;
  }

  async function search() {
    setToken();

    document.getElementById("app").innerHTML = "<p>Loading...</p>";

    const selectedRepo = document.getElementById("repo").value;
    const scanType = document.getElementById("scanType").value;

    const repos =
      selectedRepo === "All"
        ? allRepos
        : [selectedRepo];

    let repoResults;

    if (scanType === "all") {
      repoResults = await Promise.all(
        repos.flatMap(repo => [
          loadRepoAlerts(repo, "dependabot"),
          loadRepoAlerts(repo, "codescanning")
        ])
      );
    } else {
      repoResults = await Promise.all(
        repos.map(repo => loadRepoAlerts(repo, scanType))
      );
    }

    const results = repoResults.flat();

    rows = results.map(toReportRow);
    applyFilters();
  }

  function exportExcel() {
    const ws = XLSX.utils.json_to_sheet(rows);

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Dependabot Alerts");

    XLSX.writeFile(
      wb,
      `DependabotAlerts_${new Date().toISOString().slice(0, 10)}.xlsx`
    );
  }

  function applyFilters() {
    const from = document.getElementById('fromDate').value;
    const to = document.getElementById('toDate').value;
    const createFrom = document.getElementById('createFrom').value;
    const createTo = document.getElementById('createTo').value;
    const status = document.getElementById('status').value;
    const severity = document.getElementById('severity').value;

    if (status)
      rows = rows.filter(x => x.State === status);

    if (severity)
      rows = rows.filter(x => x.Severity?.toLowerCase() === severity);

    if (from)
      rows = rows.filter(x => new Date(x.FixedAt) >= new Date(from));

    if (to)
      rows = rows.filter(x => new Date(x.FixedAt) <= new Date(to));

    if (createFrom)
      rows = rows.filter(x => new Date(x.CreatedAt) >= new Date(createFrom));

    if (createTo)
      rows = rows.filter(x => new Date(x.CreatedAt) <= new Date(createTo));

    renderTable(rows);
  }

  function toReportRow(alert) {
    // Dependabot
    if (alert.security_advisory) {
      const advisory = alert.security_advisory || {};
      const vuln = alert.security_vulnerability || {};
      return {
        AlertId: alert.number,
        Summary: advisory.summary,
        State: alert.state,
        FixedAt: alert.fixed_at ?? alert.dismissed_at,
        CreatedAt: alert.created_at,
        Severity: advisory.severity,
        CVE: advisory.cve_id,
        CVSS: advisory.cvss?.score,
        FixedVersion: vuln.first_patched_version?.identifier,
        Package: alert.dependency?.package?.name,
        Project: alert.dependency?.manifest_path,
        Repo: alert.repoName,
        ScanType: "dependabot"
      };
    }

    // Code Scanning
    return {
      AlertId: alert.number,
      Summary: alert.rule?.description || alert.rule?.name || alert.most_recent_instance?.message?.text,
      State: alert.state,
      FixedAt: alert.fixed_at ?? alert.dismissed_at,
      CreatedAt: alert.created_at,
      Severity: alert.rule?.security_severity_level || alert.rule?.severity,
      CVE: "",
      CVSS: "",
      FixedVersion: "",
      Package: alert.tool?.name,
      Project: alert.most_recent_instance?.location?.path,
      Repo: alert.repoName,
      ScanType: "codescanning"
    };
  }

  function renderTable(data) {
    if (!data.length) {
      document.getElementById("app").innerHTML = "<p>No results found.</p>";
      return;
    }

    const columns = Object.keys(data[0]);

    const html = `
    <table>
      <thead>
        <tr>
          ${columns.map(c => `<th>${c}</th>`).join("")}
        </tr>
      </thead>
      <tbody>
        ${data.map(row => `
          <tr>
            ${columns.map(col => {
      let value = row[col] ?? '';

      if (col === 'Severity') {
        return `<td class="sev-${value.toLowerCase()}">${value}</td>`;
      }

      if (col === 'Summary') {
        return `<td class="summary">${value}</td>`;
      }

      return `<td>${value}</td>`;
    }).join("")}
          </tr>
        `).join("")}
      </tbody>
    </table>
  `;

    document.getElementById("app").innerHTML = html;
  }
  function exportSummary() {

    const severities = ["critical", "high", "medium", "low"];

    const buckets = [
      { label: "0-10", min: 0, max: 10 },
      { label: "11-30", min: 11, max: 30 },
      { label: "31-60", min: 31, max: 60 },
      { label: "61-90", min: 61, max: 90 },
      { label: "91-120", min: 91, max: 120 },
      { label: "121-150", min: 121, max: 150 },
      { label: "151-180", min: 151, max: 180 },
      { label: "180+", min: 181, max: Number.MAX_SAFE_INTEGER }
    ];

    function createEmptySummary() {
      const result = {};

      severities.forEach(s => {
        result[s] = {};
        buckets.forEach(b => result[s][b.label] = 0);
      });

      return result;
    }

    function getBucket(days) {

      for (const bucket of buckets) {

        if (days >= bucket.min && days <= bucket.max)
          return bucket.label;
      }

      return null;
    }

    const createdSummary = createEmptySummary();
    const resolvedSummary = createEmptySummary();

    const today = new Date();

    rows.forEach(r => {

      const severity = (r.Severity || "").toLowerCase();

      if (!severities.includes(severity))
        return;

      //
      // Created
      //
      if (r.CreatedAt) {

        const createdAt = new Date(r.CreatedAt);

        const days = Math.floor(
          (today - createdAt) / (1000 * 60 * 60 * 24)
        );

        const bucket = getBucket(days);

        if (bucket)
          createdSummary[severity][bucket]++;
      }

      //
      // Fixed/Dismissed
      //
      if (
        ["fixed", "dismissed"].includes(
          (r.State || "").toLowerCase()
        )
        && r.FixedAt
      ) {

        const fixedAt = new Date(r.FixedAt);

        const days = Math.floor(
          (today - fixedAt) / (1000 * 60 * 60 * 24)
        );

        const bucket = getBucket(days);

        if (bucket)
          resolvedSummary[severity][bucket]++;
      }
    });

    function toWorksheetData(summary) {

      return [
        [
          "Severity",
          ...buckets.map(x => x.label)
        ],
        ...severities.map(severity => [
          severity.charAt(0).toUpperCase() +
          severity.slice(1),
          ...buckets.map(
            b => summary[severity][b.label]
          )
        ])
      ];
    }

    const wb = XLSX.utils.book_new();

    const createdWs =
      XLSX.utils.aoa_to_sheet(
        toWorksheetData(createdSummary)
      );

    const resolvedWs =
      XLSX.utils.aoa_to_sheet(
        toWorksheetData(resolvedSummary)
      );

    XLSX.utils.book_append_sheet(
      wb,
      createdWs,
      "Created Alerts"
    );

    XLSX.utils.book_append_sheet(
      wb,
      resolvedWs,
      "Closed-Dismissed"
    );

    XLSX.writeFile(
      wb,
      "DependabotSummary.xlsx"
    );
  }
</script>
